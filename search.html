<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search Resources | Flourish Anyway</title><style>
*{box-sizing:border-box}:root{--p:#d23b67;--y:#f6d86f;--c:#fff8d8;--g:#4e8f3a;--i:#111;--w:#fffdf3;--t:#c96745}
body{margin:0;font-family:Arial,sans-serif;color:var(--i);background:var(--c);line-height:1.45}
.wrap{width:min(1050px,calc(100% - 28px));margin:auto}
header{padding:24px 0;background:var(--y);border-bottom:4px solid #111}
.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:inline-block;background:var(--p);color:white;border:3px solid #111;border-radius:999px;padding:7px 13px;font-weight:900;box-shadow:4px 4px #111;text-decoration:none}
.home{font-weight:900;color:#111;text-decoration:none;border:2px solid #111;border-radius:999px;padding:7px 11px;background:#fff}
h1{font-size:clamp(2rem,7vw,4.2rem);line-height:1;margin:24px 0 12px}
.lead{font-size:1.05rem;max-width:760px}
main{padding:26px 0 48px}
.panel{background:var(--w);border:3px solid #111;border-radius:20px;padding:20px;box-shadow:5px 5px rgba(0,0,0,.10)}
.eyebrow{font-size:.8rem;font-weight:900;letter-spacing:.08em;color:var(--p)}
.searchgrid{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;margin-top:16px;align-items:end}
.field{display:grid;gap:5px;font-weight:900}
input,select,button{font:inherit}input,select{min-height:50px;border:2px solid #111;border-radius:12px;background:#fff;padding:10px;width:100%}
button,.btn{cursor:pointer}.go{min-height:50px;border:2px solid #111;border-radius:12px;background:#111;color:#fff;font-weight:900;padding:0 18px}
.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:18px}
.cat{display:block;text-align:left;background:#fff;border:3px solid #111;border-radius:18px;padding:17px;box-shadow:4px 4px rgba(0,0,0,.1);text-decoration:none;color:#111}
.cat span{font-size:1.7rem;display:block}.cat b{font-size:1.05rem;display:block;margin:5px 0}.cat small{font-size:.86rem;line-height:1.3;display:block}
.results{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;margin-top:16px}
.result{background:#fff;border:3px solid #111;border-radius:18px;padding:17px;box-shadow:4px 4px rgba(0,0,0,.1)}
.result h3{margin:3px 0 8px}.category{font-size:.75rem;font-weight:900;color:var(--p);text-transform:uppercase}
.meta{display:grid;gap:5px;font-size:.9rem}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.actions a{text-decoration:none;border:2px solid #111;border-radius:9px;padding:7px 9px;background:#111;color:#fff;font-size:.82rem;font-weight:900}
.actions a.alt{background:#fff;color:#111}.actions a.call{background:var(--g)}
.count{font-weight:900;margin:16px 0 6px}.empty{background:white;border:2px dashed #111;border-radius:14px;padding:18px}
.gateway{background:var(--y);border:3px solid #111;border-radius:18px;padding:17px;margin-top:22px}
.helpbox{background:#fff;border:3px solid #111;border-radius:20px;padding:18px;margin:0 0 22px;box-shadow:5px 5px rgba(0,0,0,.1)}
.helpbox h2{margin:4px 0 6px}.helpchoices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.helpchoice{display:block;text-decoration:none;color:#111;border:2px solid #111;border-radius:14px;padding:14px;background:var(--c);font-weight:900}
.guide-step{background:#fff;border:3px solid #111;border-radius:18px;padding:17px;margin:14px 0}
.guide-step h2{margin:0 0 8px}.ask{background:var(--y);border-left:6px solid #111;padding:12px;border-radius:8px;margin-top:10px}
.checks{display:grid;gap:7px;margin-top:10px}.check{background:#fff;border:2px solid #111;border-radius:10px;padding:10px}
.notice{margin-top:22px;font-size:.86rem;color:#544d47}
@media(max-width:760px){.searchgrid,.categories,.results,.helpchoices{grid-template-columns:1fr}.go{width:100%}}
</style></head><body>
<header><div class="wrap"><div class="topbar"><a class="brand" href="index.html">✿ FLOURISH ANYWAY</a><a class="home" href="index.html">← Home</a></div><h1>FIND RESOURCES</h1><p class="lead">Ask for what you need in your own words. Search supports English, Spanish, Russian, Chinese, Vietnamese, Korean and Tagalog.</p></div></header>
<main><div class="wrap"><section class="panel"><form id="form" class="searchgrid">
<label class="field">What do you need?<input id="q" name="q" type="search" placeholder="Example: I need clothing / Necesito ropa"></label>
<label class="field">County<select id="county" name="county"><option value="all">Both counties</option><option value="Jackson">Jackson County</option><option value="Josephine">Josephine County</option></select></label>
<label class="field">City<input id="city" name="city" type="text" placeholder="Optional"></label>
<button class="go">Find Resources</button></form></section>
<div id="count" class="count">Loading resources…</div><div id="results" class="results"></div>
<section class="gateway"><h3>Still not finding it?</h3><div class="actions"><a href="https://www.211info.org/" target="_blank" rel="noopener">Search 211info ↗</a><a class="call" href="tel:211">Call 211</a></div></section></div></main>
<script src="resource-loader.js"></script><script>
const p=new URLSearchParams(location.search),q=document.getElementById("q"),county=document.getElementById("county"),city=document.getElementById("city");
q.value=p.get("q")||"";county.value=p.get("county")||"all";city.value=p.get("city")||"";

const MULTILINGUAL_PHRASES = {
  // Spanish
  "ropa":"clothing","vestimenta":"clothing","zapatos":"clothing","comida":"food","alimentos":"food",
  "despensa":"food","hambre":"food","alquiler":"rent","renta":"rent","vivienda":"housing",
  "refugio":"shelter","sin hogar":"homeless shelter","luz":"utilities","electricidad":"utilities",
  "agua":"utilities","trabajo":"jobs","empleo":"jobs","medico":"health","médico":"health",
  "salud":"health","doctor":"health","dentista":"dental","terapia":"therapy","terapeuta":"therapy",
  "salud mental":"mental health","guarderia":"childcare","guardería":"childcare","cuidado infantil":"childcare",
  "escuela":"school","colegio":"school","abogado":"legal","legal":"legal","inmigracion":"immigration",
  "inmigración":"immigration","interprete":"interpreter","intérprete":"interpreter","transporte":"transportation",
  "autobus":"transportation","autobús":"transportation","licencia":"license","violencia domestica":"domestic violence",
  "violencia doméstica":"domestic violence","adiccion":"recovery","adicción":"recovery","recuperacion":"recovery",
  "recuperación":"recovery","veterano":"veterans","veteranos":"veterans","anciano":"senior","personas mayores":"senior",
  "discapacidad":"disability","niño":"children","niños":"children","familia":"family","embarazada":"pregnancy",

  // Russian
  "одежда":"clothing","обувь":"clothing","еда":"food","продукты":"food","жилье":"housing","жильё":"housing",
  "аренда":"rent","приют":"shelter","бездомный":"homeless shelter","работа":"jobs","здоровье":"health",
  "врач":"health","стоматолог":"dental","психолог":"therapy","психическое здоровье":"mental health",
  "детский сад":"childcare","школа":"school","юрист":"legal","иммиграция":"immigration",
  "переводчик":"interpreter","транспорт":"transportation","автобус":"transportation","права":"license",
  "домашнее насилие":"domestic violence","зависимость":"recovery","ветеран":"veterans","инвалидность":"disability",
  "дети":"children","семья":"family",

  // Simplified + Traditional Chinese
  "衣服":"clothing","鞋":"clothing","食物":"food","食品":"food","住房":"housing","房租":"rent","租金":"rent",
  "庇护所":"shelter","收容所":"shelter","工作":"jobs","就业":"jobs","就業":"jobs","健康":"health",
  "医生":"health","醫生":"health","牙医":"dental","牙醫":"dental","心理健康":"mental health","托儿":"childcare",
  "托兒":"childcare","学校":"school","學校":"school","律师":"legal","律師":"legal","移民":"immigration",
  "翻译":"interpreter","翻譯":"interpreter","交通":"transportation","驾照":"license","駕照":"license",
  "家庭暴力":"domestic violence","康复":"recovery","康復":"recovery","退伍军人":"veterans","退伍軍人":"veterans",
  "残疾":"disability","殘疾":"disability","儿童":"children","兒童":"children","家庭":"family",

  // Vietnamese
  "quần áo":"clothing","giày":"clothing","thức ăn":"food","thực phẩm":"food","nhà ở":"housing",
  "tiền thuê nhà":"rent","nơi trú ẩn":"shelter","việc làm":"jobs","công việc":"jobs","sức khỏe":"health",
  "bác sĩ":"health","nha sĩ":"dental","sức khỏe tâm thần":"mental health","giữ trẻ":"childcare",
  "trường học":"school","luật sư":"legal","nhập cư":"immigration","phiên dịch":"interpreter",
  "giao thông":"transportation","bằng lái":"license","bạo lực gia đình":"domestic violence",
  "phục hồi":"recovery","cựu chiến binh":"veterans","khuyết tật":"disability","trẻ em":"children","gia đình":"family",

  // Korean
  "옷":"clothing","신발":"clothing","음식":"food","식품":"food","주택":"housing","임대료":"rent",
  "보호소":"shelter","직업":"jobs","일자리":"jobs","건강":"health","의사":"health","치과":"dental",
  "정신 건강":"mental health","보육":"childcare","학교":"school","변호사":"legal","이민":"immigration",
  "통역":"interpreter","교통":"transportation","운전면허":"license","가정 폭력":"domestic violence",
  "회복":"recovery","재향군인":"veterans","장애":"disability","어린이":"children","가족":"family",

  // Tagalog
  "damit":"clothing","sapatos":"clothing","pagkain":"food","pabahay":"housing","upa":"rent",
  "silungan":"shelter","trabaho":"jobs","kalusugan":"health","doktor":"health","dentista":"dental",
  "kalusugang pangkaisipan":"mental health","pag aalaga ng bata":"childcare","pag-aalaga ng bata":"childcare",
  "paaralan":"school","abogado":"legal","imigrasyon":"immigration","tagasalin":"interpreter",
  "transportasyon":"transportation","lisensya":"license","karahasan sa tahanan":"domestic violence",
  "pagbawi":"recovery","beterano":"veterans","kapansanan":"disability","mga bata":"children","pamilya":"family"
};

const MULTILINGUAL_FILLER = new Set([
  // English
  "the","and","for","with","that","this","from","into","need","needs","needed","help","find","looking","want",
  "right","please","can","could","you","your","some","something","anything","my","me","i","im","a","an","of","to","in","on",
  // Spanish
  "yo","necesito","necesita","necesitamos","ayuda","ayudar","busco","buscar","quiero","para","con","mi","mis","un","una","de","en","por","favor",
  // Tagalog common filler
  "kailangan","ko","ng","mga","para","tulong","hanap","ako"
]);

function multilingualIntent(raw){
  let s=norm(raw);
  const intents=[];
  // Longest phrases first so "salud mental" becomes mental health before "salud" becomes health.
  Object.keys(MULTILINGUAL_PHRASES).sort((a,b)=>b.length-a.length).forEach(k=>{
    if(s.includes(norm(k))){
      intents.push(MULTILINGUAL_PHRASES[k]);
      s=s.split(norm(k)).join(" ");
    }
  });
  const leftovers=s.split(/\s+/).map(w=>w.replace(/[^\p{L}\p{N}-]/gu,"")).filter(w=>w.length>1&&!MULTILINGUAL_FILLER.has(w));
  return [...new Set([...intents,...leftovers])].join(" ").trim();
}

function render(){
  const raw=norm(q.value),term=multilingualIntent(raw)||raw,co=county.value,ci=norm(city.value.trim());
  const words=term.split(/\s+/).filter(w=>w.length>1);
  let a=RES.filter(r=>{
    if(co!=="all"&&!(r.counties||[]).includes(co))return false;
    const h=resourceHaystack(r);
    if(ci&&!h.includes(ci))return false;
    if(!term)return true;
    if(h.includes(term))return true;
    // Natural-language search: any meaningful translated intent may qualify,
    // but rank stronger matches first below.
    return words.some(w=>h.includes(w));
  });
  a=a.map(r=>{
    const h=resourceHaystack(r);
    let score=h.includes(term)?100:0;
    words.forEach(w=>{if(h.includes(w))score+=20});
    return {r,score};
  }).sort((a,b)=>b.score-a.score||a.r.name.localeCompare(b.r.name)).map(x=>x.r).slice(0,40);
  document.getElementById("count").textContent=`${a.length} resource${a.length===1?"":"s"} found`;
  document.getElementById("results").innerHTML=a.length?a.map(resultCard).join(""):`<div class="empty"><b>No close directory match yet.</b><p>Try fewer words, leave city blank, or use 211 below.</p></div>`;
}
getResources().then(render);document.getElementById("form").onsubmit=e=>{e.preventDefault();history.replaceState(null,"",`?q=${encodeURIComponent(q.value)}&county=${encodeURIComponent(county.value)}&city=${encodeURIComponent(city.value)}`);render()}
</script></body></html>
