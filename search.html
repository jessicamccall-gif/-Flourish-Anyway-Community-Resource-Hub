<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search Resources | Flourish Anyway</title><style>
*{box-sizing:border-box}:root{--p:#d23b67;--y:#f6d86f;--c:#fff8d8;--g:#4e8f3a;--i:#111;--w:#fffdf3;--t:#c96745}
body{margin:0;font-family:Arial,sans-serif;color:var(--i);background:var(--c);line-height:1.45}
.wrap{width:min(1050px,calc(100% - 28px));margin:auto}
header{padding:24px 0;background:var(--y);border-bottom:4px solid #111}
.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:inline-block;background:var(--p);color:white;border:3px solid #111;border-radius:999px;padding:7px 13px;font-weight:900;box-shadow:4px 4px #111;text-decoration:none}
.home{font-weight:900;color:#111;text-decoration:none;border:2px solid #111;border-radius:999px;padding:7px 11px;background:#fff}
h1{font-size:clamp(2rem,7vw,4.2rem);line-height:1;margin:24px 0 12px}
.lead{font-size:1.05rem;max-width:760px}
main{padding:26px 0 48px}
.panel{background:var(--w);border:3px solid #111;border-radius:20px;padding:20px;box-shadow:5px 5px rgba(0,0,0,.10)}
.eyebrow{font-size:.8rem;font-weight:900;letter-spacing:.08em;color:var(--p)}
.searchgrid{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;margin-top:16px;align-items:end}
.field{display:grid;gap:5px;font-weight:900}
input,select,button{font:inherit}input,select{min-height:50px;border:2px solid #111;border-radius:12px;background:#fff;padding:10px;width:100%}
button,.btn{cursor:pointer}.go{min-height:50px;border:2px solid #111;border-radius:12px;background:#111;color:#fff;font-weight:900;padding:0 18px}
.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:18px}
.cat{display:block;text-align:left;background:#fff;border:3px solid #111;border-radius:18px;padding:17px;box-shadow:4px 4px rgba(0,0,0,.1);text-decoration:none;color:#111}
.cat span{font-size:1.7rem;display:block}.cat b{font-size:1.05rem;display:block;margin:5px 0}.cat small{font-size:.86rem;line-height:1.3;display:block}
.results{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;margin-top:16px}
.result{background:#fff;border:3px solid #111;border-radius:18px;padding:17px;box-shadow:4px 4px rgba(0,0,0,.1)}
.result h3{margin:3px 0 8px}.category{font-size:.75rem;font-weight:900;color:var(--p);text-transform:uppercase}
.meta{display:grid;gap:5px;font-size:.9rem}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.actions a{text-decoration:none;border:2px solid #111;border-radius:9px;padding:7px 9px;background:#111;color:#fff;font-size:.82rem;font-weight:900}
.actions a.alt{background:#fff;color:#111}.actions a.call{background:var(--g)}
.plan{background:#fff;border:3px solid #111;border-radius:18px;padding:17px;box-shadow:4px 4px rgba(0,0,0,.1)}.plan h3{margin:3px 0 8px}.plan a{text-decoration:none;color:#111}.count{font-weight:900;margin:16px 0 6px}.empty{background:white;border:2px dashed #111;border-radius:14px;padding:18px}
.gateway{background:var(--y);border:3px solid #111;border-radius:18px;padding:17px;margin-top:22px}
.helpbox{background:#fff;border:3px solid #111;border-radius:20px;padding:18px;margin:0 0 22px;box-shadow:5px 5px rgba(0,0,0,.1)}
.helpbox h2{margin:4px 0 6px}.helpchoices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.helpchoice{display:block;text-decoration:none;color:#111;border:2px solid #111;border-radius:14px;padding:14px;background:var(--c);font-weight:900}
.guide-step{background:#fff;border:3px solid #111;border-radius:18px;padding:17px;margin:14px 0}
.guide-step h2{margin:0 0 8px}.ask{background:var(--y);border-left:6px solid #111;padding:12px;border-radius:8px;margin-top:10px}
.checks{display:grid;gap:7px;margin-top:10px}.check{background:#fff;border:2px solid #111;border-radius:10px;padding:10px}
.notice{margin-top:22px;font-size:.86rem;color:#544d47}
@media(max-width:760px){.searchgrid,.categories,.results,.helpchoices{grid-template-columns:1fr}.go{width:100%}}
</style></head><body>
<header><div class="wrap"><div class="topbar"><a class="brand" href="index.html">✿ FLOURISH ANYWAY</a><a class="home" href="index.html">← Home</a></div><h1>FIND RESOURCES</h1><p class="lead">Ask for what you need in plain language. You can change the search without leaving this page.</p></div></header>
<main><div class="wrap"><section class="panel"><form id="form" class="searchgrid">
<label class="field">What do you need?<input id="q" name="q" type="search" placeholder="Example: help getting my license back"></label>
<label class="field">County<select id="county" name="county"><option value="all">Both counties</option><option value="Jackson">Jackson County</option><option value="Josephine">Josephine County</option></select></label>
<label class="field">City<input id="city" name="city" type="text" placeholder="Optional"></label>
<button class="go">Find Resources</button></form></section>
<div id="count" class="count">Loading resources…</div><div id="results" class="results"></div>
<section class="gateway"><h3>Still not finding it?</h3><div class="actions"><a href="https://www.211info.org/" target="_blank" rel="noopener">Search 211info ↗</a><a class="call" href="tel:211">Call 211</a></div></section></div></main>
<script src="resource-loader.js"></script><script>
const p=new URLSearchParams(location.search),q=document.getElementById("q"),county=document.getElementById("county"),city=document.getElementById("city");
q.value=p.get("q")||"";county.value=p.get("county")||"all";city.value=p.get("city")||"";
const HELP_PLANS=[
{title:"Getting my first driver's license",cat:"Transportation",url:"first-license.html",terms:["first license","permit","drivers test","driving test","learn to drive","get license"]},
{title:"Getting my license back",cat:"Transportation",url:"drivers-license.html",terms:["license back","suspended license","revoked license","reinstatement","dws","duii","hardship permit"]},
{title:"Fixing SR-22 or car insurance",cat:"Transportation",url:"car-legal.html#insurance",terms:["sr22","sr-22","insurance lapse","car insurance","insurance canceled","uninsured"]},
{title:"Tickets, court debt & DMV holds",cat:"Transportation",url:"car-legal.html#tickets",terms:["ticket","tickets","court debt","traffic fine","dmv hold","fines"]},
{title:"Tags, registration & title",cat:"Transportation",url:"car-legal.html#tags",terms:["tags","registration","title","plates","car legal"]},
{title:"Divorce papers & Oregon court forms",cat:"Legal & Government Help",url:"life-plans.html#divorce",terms:["divorce","divorce papers","dissolution","separation","respond to divorce"]},
{title:"Child support help",cat:"Parenting & Legal",url:"life-plans.html#child-support",terms:["child support","support order","arrears","modify support"]},
{title:"Apply for OHP / health coverage",cat:"Health & Wellness",url:"life-plans.html#ohp",terms:["ohp","health insurance","medicaid","uninsured","health coverage"]},
{title:"Apply for food, cash or child-care benefits",cat:"Food & Everyday Needs",url:"life-plans.html#benefits",terms:["snap","food stamps","tanf","cash assistance","child care benefits","benefits"]},
{title:"School, tutoring & learning help",cat:"Kids & Family",url:"life-plans.html#school",terms:["school","tutor","tutoring","homework","learning","iep","special education"]}
];
function wordsOf(x){return norm(x).split(/\s+/).filter(w=>w.length>2)}
function scoreResource(r,term,ci){if(!term&&!ci)return 1;const name=norm(r.name),helps=norm(r.helps||r.description||r.service),kw=norm([...(r.keywords||[]),...(r.labels||[])].join(' ')),addr=norm([r.city,r.address].join(' ')),h=resourceHaystack(r);let score=0;if(term){if(name===term)score+=120;if(name.includes(term))score+=80;if(helps.includes(term))score+=55;if(kw.includes(term))score+=50;const ws=wordsOf(term);for(const w of ws){if(name.includes(w))score+=18;if(kw.includes(w))score+=15;if(helps.includes(w))score+=10}if(ws.length&&ws.every(w=>h.includes(w)))score+=30;if(ws.length>1&&!ws.some(w=>name.includes(w)||kw.includes(w)||helps.includes(w)))return 0}if(ci){if(addr.includes(ci))score+=35;else if(!h.includes(ci))return 0}return score}
function planMatches(term){if(!term)return[];const ws=wordsOf(term);return HELP_PLANS.map(p=>{const h=norm(p.title+' '+p.cat+' '+p.terms.join(' '));let score=h.includes(term)?150:0;for(const w of ws)if(h.includes(w))score+=25;return{...p,score}}).filter(p=>p.score>=Math.max(25,ws.length*25)).sort((a,b)=>b.score-a.score).slice(0,4)}
function planCard(p){return `<article class="plan"><div class="category">HELP PLAN • ${esc(p.cat)}</div><h3><a href="${p.url}">📋 ${esc(p.title)} →</a></h3><p>Step-by-step help: what to do, what to gather, who to call and what to ask.</p></article>`}
function render(){const term=norm(q.value),co=county.value,ci=norm(city.value.trim());let scored=RES.filter(r=>co==="all"||(r.counties||[]).includes(co)).map(r=>({r,score:scoreResource(r,term,ci)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.r.name.localeCompare(b.r.name));if(term)scored=scored.slice(0,30);const plans=planMatches(term);const cards=[...plans.map(planCard),...scored.map(x=>resultCard(x.r))];document.getElementById("count").textContent=cards.length?`${cards.length} strong match${cards.length===1?"":"es"}`:"No strong matches";document.getElementById("results").innerHTML=cards.length?cards.join(""):`<div class="empty"><b>No strong matches yet.</b><p>Try a simpler phrase like “child therapist,” “divorce papers,” “rent help,” or leave city blank. You can also use 211 below.</p></div>`}
getResources().then(render).catch(err=>{console.error(err);document.getElementById('count').textContent='Resources could not load. Please refresh or use 211 below.';});document.getElementById("form").onsubmit=e=>{e.preventDefault();history.replaceState(null,"",`?q=${encodeURIComponent(q.value)}&county=${encodeURIComponent(county.value)}&city=${encodeURIComponent(city.value)}`);render()}
</script></body></html>
