<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Find Resources | Flourish Anyway</title><style>

*{box-sizing:border-box}:root{--p:#d23b67;--y:#fad569;--c:#fff8d8;--g:#4e8f3a;--i:#111;--w:#fffdf3;--pl:#fce8ed}
body{margin:0;font-family:Arial,sans-serif;color:var(--i);background:var(--c);line-height:1.45}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}
header{padding:24px 0;background:var(--y);border-bottom:4px solid #111}.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:inline-block;background:var(--p);color:#fff;border:3px solid #111;border-radius:999px;padding:7px 13px;font-weight:900;box-shadow:4px 4px #111;text-decoration:none}
.home{font-weight:900;color:#111;text-decoration:none;border:2px solid #111;border-radius:999px;padding:7px 11px;background:#fff}
h1{font-size:clamp(2rem,7vw,4.2rem);line-height:1;margin:24px 0 12px}.lead{font-size:1.05rem;max-width:780px}main{padding:26px 0 48px}
.eyebrow{font-size:.8rem;font-weight:900;letter-spacing:.08em;color:var(--p)}

.panel,.outside{background:var(--w);border:3px solid #111;border-radius:20px;padding:18px;box-shadow:5px 5px rgba(0,0,0,.1);margin-bottom:20px}.searchgrid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-top:12px}.field{display:grid;gap:5px;font-weight:900}.full{grid-column:1/-1}input,select,button{font:inherit;min-height:48px;border:2px solid #111;border-radius:12px;padding:9px;background:#fff}.go{background:#111;color:#fff;font-weight:900}
.results{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.result,.plan{background:#fff;border:3px solid #111;border-radius:18px;padding:17px;box-shadow:4px 4px rgba(0,0,0,.1)}.result h3,.plan h3{margin:3px 0 8px}.category{font-size:.75rem;font-weight:900;color:var(--p);text-transform:uppercase}.meta{display:grid;gap:5px;font-size:.9rem}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.actions a,.plan a{text-decoration:none}.actions a{border:2px solid #111;border-radius:9px;padding:7px 9px;background:#111;color:#fff;font-size:.82rem;font-weight:900}.actions a.alt{background:#fff;color:#111}.actions a.call{background:var(--g)}.count{font-weight:900;margin:16px 0 8px}.empty{background:#fff;border:2px dashed #111;border-radius:14px;padding:18px}
@media(max-width:760px){.searchgrid,.results{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body>
<header><div class="wrap"><div class="topbar"><a class="brand" href="index.html">✿ FLOURISH ANYWAY</a><a class="home" href="index.html">← Home</a></div><h1>FIND RESOURCES</h1><p class="lead">Ask for what you need. Add a circumstance only if it helps narrow the results.</p></div></header>
<main><div class="wrap"><section class="panel"><form id="form" class="searchgrid">
<label class="field full">What do you need?<input id="q" type="search" placeholder="Example: my child needs help at school"></label>
<label class="field">County<select id="county"><option value="all">Both counties</option><option value="Jackson">Jackson County</option><option value="Josephine">Josephine County</option></select></label>
<label class="field">City<input id="city" type="text" placeholder="Optional"></label>
<label class="field">Does any of this describe you?<select id="who"><option value="">No extra filter</option></select></label>
<button class="go full">Find Resources →</button></form></section>
<div id="count" class="count">Loading resources…</div><div id="results" class="results"></div>
<section class="outside"><h3>Search beyond the Flourish directory</h3><p>If the Hub does not have a close match yet, use 211 for current statewide resources.</p><div class="actions"><a href="https://www.211info.org/" target="_blank" rel="noopener">Search 211info ↗</a><a class="call" href="tel:211">Call 211</a></div></section></div></main>
<script src="hub-pathways-data.js"></script><script src="resource-loader.js"></script><script src="life-plans-data.js?v=20260904master1"></script><script>
const H=window.FLOURISH_HUB_PATHWAYS||{circumstances:[]},P=new URLSearchParams(location.search),q=document.getElementById("q"),county=document.getElementById("county"),city=document.getElementById("city"),who=document.getElementById("who");
q.value=P.get("q")||"";county.value=P.get("county")||"all";city.value=P.get("city")||"";who.innerHTML='<option value="">No extra filter</option>'+H.circumstances.map(x=>`<option value="${esc(x.id)}">${esc(x.label)}</option>`).join("");who.value=P.get("who")||"";
const planCategories=window.FLOURISH_HELP_PLAN_CATEGORIES||{},lifePlans=window.FLOURISH_LIFE_PLANS||[];
const STOP=new Set(["the","and","for","with","that","this","from","into","need","help","find","near","around","local","someone","my","me","i","a","an","of","to","in","on"]);
function wordsOf(x){return norm(x).split(/\s+/).map(w=>w.replace(/[^a-z0-9-]/g,"")).filter(w=>w.length>1&&!STOP.has(w))}
function scoreResource(r,term,ci){const h=resourceHaystack(r),name=norm(r.name),section=norm(r.section),ws=wordsOf(term);let score=0,matched=0;if(term){if(name.includes(term))score+=170;if(section.includes(term))score+=80;for(const w of ws){if(h.includes(w)){matched++;score+=35}}if(ws.length>=2&&matched<Math.ceil(ws.length*.6))return 0;if(ws.length===1&&matched===0)return 0;if(ws.length&&ws.every(w=>h.includes(w)))score+=70;}else score=1;if(ci&&!h.includes(ci))return 0;return score;}
function planMatches(term){if(!term)return[];const ws=wordsOf(term);return lifePlans.map(p=>{const h=norm([p.title,p.intro,p.script,...(p.checks||[]).flatMap(c=>[c.title,c.text])].filter(Boolean).join(" "));let matched=0,score=h.includes(term)?180:0;ws.forEach(w=>{if(h.includes(w)){matched++;score+=35}});if(ws.length>=2&&matched<Math.ceil(ws.length*.6))score=0;return {...p,score};}).filter(p=>p.score>=35).sort((a,b)=>b.score-a.score).slice(0,3);}
function planCard(p){return `<article class="plan"><div class="category">HELP PLAN • ${esc(planCategories[p.category]||p.category||"")}</div><h3><a href="life-plans.html#${encodeURIComponent(p.id)}">📋 ${esc(p.title)} →</a></h3><p>${esc(p.intro||"Step-by-step help.")}</p></article>`}
function render(){const term=norm(q.value),co=county.value,ci=norm(city.value),circ=H.circumstances.find(x=>x.id===who.value);let scored=RES.filter(r=>co==="all"||(r.counties||[]).includes(co)).filter(r=>!circ||matchesCircumstance(r,circ.terms)).map(r=>({r,score:scoreResource(r,term,ci)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||String(a.r.name).localeCompare(String(b.r.name)));if(term)scored=scored.slice(0,40);const plans=planMatches(term);const cards=[...plans.map(planCard),...scored.map(x=>resultCard(x.r))];document.getElementById("count").textContent=cards.length?`${cards.length} focused match${cards.length===1?"":"es"}`:"No close Hub matches yet";document.getElementById("results").innerHTML=cards.length?cards.join(""):`<div class="empty"><b>No close match yet.</b><p>Try a shorter phrase, remove the extra filter, or use 211 below.</p></div>`;}
getResources().then(render);document.getElementById("form").onsubmit=e=>{e.preventDefault();history.replaceState(null,"",`?q=${encodeURIComponent(q.value)}&county=${encodeURIComponent(county.value)}&city=${encodeURIComponent(city.value)}&who=${encodeURIComponent(who.value)}`);render();};
</script></body></html>
