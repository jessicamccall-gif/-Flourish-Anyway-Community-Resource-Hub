<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Help Me Make a Plan | Flourish Anyway</title>
<style>
*{box-sizing:border-box}
:root{--pink:#d23b67;--yellow:#f6d86f;--cream:#fff8d8;--green:#4e8f3a;--ink:#111}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--cream);color:var(--ink);line-height:1.45}
.wrap{width:min(900px,calc(100% - 28px));margin:auto}
header{background:var(--yellow);border-bottom:4px solid var(--ink);padding:22px 0}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand,.home{border:3px solid var(--ink);border-radius:999px;padding:8px 13px;text-decoration:none;font-weight:900;color:var(--ink);background:#fff}
.brand{background:var(--pink);color:#fff;box-shadow:4px 4px var(--ink)}
h1{font-size:clamp(2.15rem,8vw,4.25rem);line-height:.97;margin:24px 0 8px}
header p{font-size:1.05rem;font-weight:700;max-width:720px}
main{padding:22px 0 52px}
.panel,.guide{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:18px;margin:16px 0;box-shadow:5px 5px rgba(0,0,0,.10)}
.eyebrow{font-size:.8rem;font-weight:900;letter-spacing:.08em;color:var(--pink);text-transform:uppercase}
.guide h2,.panel h2{font-size:clamp(1.7rem,6vw,2.45rem);line-height:1.1;margin:7px 0 8px}
.intro{font-size:1.05rem;margin:0 0 14px}
.category-block{margin:20px 0}
.category-title{background:var(--yellow);border:3px solid var(--ink);border-radius:18px;padding:13px 15px;font-weight:900;font-size:1.25rem;box-shadow:3px 3px var(--ink);margin-bottom:12px}
.chooser{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.choice{display:block;background:#fff;border:3px solid var(--ink);border-radius:15px;padding:13px;text-decoration:none;color:var(--ink);font-weight:900;box-shadow:3px 3px var(--ink)}
.choice:active{transform:translate(2px,2px);box-shadow:1px 1px var(--ink)}
.searchbox{width:100%;border:3px solid var(--ink);border-radius:14px;padding:13px 14px;font:inherit;font-size:1rem;margin:10px 0 4px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.quick a,.quick span{display:inline-flex;gap:7px;align-items:center;border:3px solid var(--ink);border-radius:13px;padding:9px 11px;background:var(--green);color:#fff;text-decoration:none;font-weight:900}
.script{background:var(--yellow);border:3px solid var(--ink);border-radius:15px;padding:13px 14px;margin:12px 0}
.script strong{display:block;margin-bottom:5px}
.checks{display:grid;gap:10px;margin-top:14px}
.check{display:flex;gap:12px;align-items:flex-start;border:3px solid var(--ink);border-radius:15px;padding:13px;background:#fffdf3}
.check input{width:24px;height:24px;flex:0 0 auto;margin-top:2px}
.check-title{font-weight:900;font-size:1.05rem;display:block}
.check-text{display:block;margin-top:3px}
.check.done{opacity:.72}
.step-card{border:3px solid var(--ink);border-radius:20px;background:#fff;margin:18px 0;overflow:hidden;box-shadow:4px 4px rgba(0,0,0,.08)}
.step-head{display:flex;gap:12px;align-items:flex-start;padding:17px 17px 10px}
.step-head input{width:26px;height:26px;flex:0 0 auto;margin-top:4px}
.step-number{font-size:1.55rem;font-weight:900;line-height:1.15}
.step-title{font-size:1.3rem;font-weight:900;line-height:1.2}
.step-body{padding:0 17px 18px 55px}
.step-text{font-size:1.03rem;margin:0 0 12px}
.step-contact-list{display:grid;gap:8px;margin:10px 0 13px}
.step-contact{display:block;border:2px solid var(--ink);border-radius:12px;padding:10px 12px;background:#fffdf3;color:var(--ink);text-decoration:none;font-weight:800}
.step-contact[href^="tel:"]::before{content:"☎ ";font-weight:900}
.step-contact[href^="mailto:"]::before{content:"✉ ";font-weight:900}
.step-contact[href^="http"]::before{content:"↗ ";font-weight:900}
.step-script,.step-note,.step-worksheet{border:3px solid var(--ink);border-radius:14px;padding:12px 13px;margin:11px 0;background:var(--yellow)}
.step-note{background:#fff8d8}
.step-worksheet{background:#fffdf3}
.step-script strong,.step-note strong,.step-worksheet strong{display:block;margin-bottom:5px}
.step-worksheet div{padding:4px 0;border-bottom:1px dashed #8b806b}
.step-worksheet div:last-child{border-bottom:0}
.step-card.done{opacity:.72}
.step-card.done .step-title{text-decoration:line-through}
.progress{font-weight:900;margin:7px 0 14px}
.start-card{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:18px;margin:0 0 18px;box-shadow:5px 5px rgba(0,0,0,.10)}
.start-card h2{font-size:clamp(1.7rem,6vw,2.45rem);line-height:1.1;margin:7px 0 8px}
.plan-actions{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}
.plan-actions a{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;font-weight:900;border:3px solid var(--ink);border-radius:12px;padding:10px 12px}
@media(max-width:560px){.step-body{padding:0 14px 16px}.step-head{padding:15px 14px 9px}.step-number{font-size:1.35rem}.step-title{font-size:1.18rem}.step-contact{font-size:.98rem;overflow-wrap:anywhere}}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.actions a{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;font-weight:900;border:3px solid var(--ink);border-radius:12px;padding:10px 12px}
.plan-tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.toolbtn,.backbtn{appearance:none;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink);font:inherit;font-weight:900;text-decoration:none;cursor:pointer}
.toolbtn.primary{background:var(--pink);color:#fff}
.saved-note{font-size:.92rem;font-weight:800;margin:4px 0 14px}
.notice{font-size:.88rem;color:#544d47;border-top:2px solid var(--ink);padding-top:17px;margin-top:28px}
.hidden{display:none!important}
@media(max-width:560px){.wrap{width:min(100% - 20px,900px)}.panel,.guide{padding:15px;border-radius:19px}.chooser{grid-template-columns:1fr}.toolbtn,.backbtn{flex:1 1 auto;text-align:center}}
@media print{header,.plan-tools,.notice{display:none!important}body{background:#fff}.guide{box-shadow:none;border:1px solid #777}.actions a{color:#111;background:#fff;border:1px solid #777}.wrap{width:100%}}
</style>
</head>
<body>
<header><div class="wrap">
<div class="top"><a class="brand" href="index.html">✿ FLOURISH ANYWAY</a><a class="home" href="index.html">← Home</a></div>
<h1>HELP ME MAKE A PLAN</h1>
<p id="subhead">Pick the situation that fits. One plan at a time. Your checks save on this device.</p>
</div></header>
<main><div class="wrap" id="app"><div class="panel"><strong>Loading Help Plans…</strong></div></div></main>
<script src="life-plans-data.js?v=20260904"></script>
<script>
(function(){
const app=document.getElementById('app'), plans=window.FLOURISH_LIFE_PLANS||[], cats=window.FLOURISH_HELP_PLAN_CATEGORIES||{};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function disclaimer(){return `<div class="notice"><strong>Community information only.</strong> Flourish Anyway provides navigation and community-resource information, not legal, medical, financial or emergency advice. Eligibility, costs, availability, schedules, forms and program rules can change; confirm important details directly with the provider or official agency. For immediate danger call 911; for suicide or mental-health crisis support call or text 988.<br><br><strong>Missing or outdated resource?</strong> <a href="https://weflourishanyway.org/" target="_blank" rel="noopener">Contact Flourish Anyway</a>.</div>`}
function bindChecks(root){
const update=()=>{const boxes=[...root.querySelectorAll('[data-check]')],done=boxes.filter(x=>x.checked).length;const p=root.querySelector('[data-progress]');if(p)p.textContent=done+' of '+boxes.length+' steps checked';};
root.querySelectorAll('[data-check]').forEach(x=>{const k='flourish-plan-'+x.dataset.check;x.checked=localStorage.getItem(k)==='1';x.closest('.step-card')?.classList.toggle('done',x.checked);x.onchange=()=>{localStorage.setItem(k,x.checked?'1':'0');x.closest('.step-card')?.classList.toggle('done',x.checked);update()}});
update();
}
function planText(p,root){const lines=[p.title,'',p.intro,''];root.querySelectorAll('.check').forEach(row=>{const box=row.querySelector('input'),t=row.querySelector('.check-title')?.textContent||'',d=row.querySelector('.check-text')?.textContent||'';lines.push((box?.checked?'☑':'☐')+' '+t+(d?' — '+d:''))});if(p.script)lines.push('','WHAT TO SAY: '+p.script);lines.push('','Flourish Anyway Help Plan',location.href);return lines.join('\n')}
function tools(p,root){const bar=document.createElement('div');bar.className='plan-tools';bar.innerHTML=`<a class="backbtn" href="life-plans.html">← All Help Plans</a><button class="toolbtn primary" type="button" data-print>Print / Save PDF</button><button class="toolbtn" type="button" data-share>Share</button><button class="toolbtn" type="button" data-email>Email</button><button class="toolbtn" type="button" data-clear>Clear checks</button>`;root.prepend(bar);
bar.querySelector('[data-print]').onclick=()=>window.print();
bar.querySelector('[data-share]').onclick=async()=>{const data={title:'Flourish Anyway Help Plan: '+p.title,text:planText(p,root),url:location.href};if(navigator.share){try{await navigator.share(data)}catch(e){}}else{try{await navigator.clipboard.writeText(data.text+'\n'+data.url);alert('Plan copied.')}catch(e){alert('Use your browser Share menu to share this plan.')}}};
bar.querySelector('[data-email]').onclick=()=>{location.href='mailto:?subject='+encodeURIComponent('My Flourish Help Plan: '+p.title)+'&body='+encodeURIComponent(planText(p,root))};
bar.querySelector('[data-clear]').onclick=()=>{if(!confirm('Clear the checked steps in this plan?'))return;root.querySelectorAll('[data-check]').forEach(x=>{x.checked=false;localStorage.removeItem('flourish-plan-'+x.dataset.check);x.closest('.step-card')?.classList.remove('done')})}}
function contactHTML(c){
const href=c.href||'';
const label=esc(c.label||'Contact');
const value=esc(c.value||'');
if(href)return `<a class="step-contact" href="${esc(href)}" ${/^https?:/.test(href)?'target="_blank" rel="noopener"':''}><strong>${label}</strong>${value?`: ${value}`:''}</a>`;
return `<div class="step-contact"><strong>${label}</strong>${value?`: ${value}`:''}</div>`;
}
function stepHTML(c,i){
const contacts=(c.contacts||[]).map(contactHTML).join('');
const worksheet=(c.worksheet||[]).length?`<div class="step-worksheet"><strong>Write this down / have this ready</strong>${c.worksheet.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`:'';
const script=c.script?`<div class="step-script"><strong>Ask exactly:</strong>${esc(c.script)}</div>`:'';
const note=c.note?`<div class="step-note"><strong>Good to know</strong>${esc(c.note)}</div>`:'';
return `<section class="step-card">
<label class="step-head"><input type="checkbox" data-check="${esc(c.id)}"><span><span class="step-number">${i+1}.</span> <span class="step-title">${esc(c.title||c.text)}</span></span></label>
<div class="step-body">${c.title&&c.text?`<p class="step-text">${esc(c.text)}</p>`:''}${contacts?`<div class="step-contact-list">${contacts}</div>`:''}${script}${worksheet}${note}</div>
</section>`;
}
function renderPlan(p){
const quick=(p.quick||[]).map(q=>q.href?`<a href="${esc(q.href)}">${esc(q.label)}: ${esc(q.value)}</a>`:`<span>${esc(q.label)}: ${esc(q.value)}</span>`).join('');
const actions=(p.actions||[]).map(a=>`<a href="${esc(a.href)}" ${/^https?:/.test(a.href)?'target="_blank" rel="noopener"':''}>${esc(a.label)}</a>`).join('');
const steps=(p.checks||[]).map(stepHTML).join('');
app.innerHTML=`<section class="start-card"><div class="eyebrow">START HERE</div><h2>${esc(p.title)}</h2><p class="intro">${esc(p.intro)}</p><div class="saved-note">✓ Check each step as you finish it. Your progress saves automatically on this device.</div><div class="progress" data-progress></div>${quick?`<div class="quick">${quick}</div>`:''}</section><section class="guide">${steps}${actions?`<div class="plan-actions">${actions}</div>`:''}</section>${disclaimer()}`;
const root=app.querySelector('.guide');
bindChecks(root);
tools(p,root);
document.getElementById('subhead').textContent='Clear steps, real contacts, and exactly what to ask.';
document.title=p.title+' | Flourish Anyway';
window.scrollTo(0,0)
}
function renderPicker(){document.title='Help Me Make a Plan | Flourish Anyway';document.getElementById('subhead').textContent='Pick the situation that fits. One plan at a time. Your checks save on this device.';let body=`<section class="panel"><div class="eyebrow">HELP PLANS</div><h2>What do you need help with?</h2><p>Pick one situation. You will only see that plan.</p><input id="planSearch" class="searchbox" type="search" placeholder="Search: license, food, custody, job…"></section>`;
for(const[cid,label]of Object.entries(cats)){const items=plans.filter(p=>p.category===cid);if(!items.length)continue;body+=`<section class="category-block"><div class="category-title">${esc(label)}</div><div class="chooser">${items.map(p=>`<a class="choice" data-plan-title="${esc((p.title+' '+p.intro).toLowerCase())}" href="#${encodeURIComponent(p.id)}">${esc(p.title)}</a>`).join('')}</div></section>`}app.innerHTML=body+disclaimer();const s=document.getElementById('planSearch');s.oninput=()=>{const q=s.value.trim().toLowerCase();document.querySelectorAll('.choice').forEach(a=>a.classList.toggle('hidden',q&&!a.dataset.planTitle.includes(q)));document.querySelectorAll('.category-block').forEach(sec=>sec.classList.toggle('hidden',![...sec.querySelectorAll('.choice')].some(a=>!a.classList.contains('hidden'))))};window.scrollTo(0,0)}
function render(){const id=decodeURIComponent(location.hash.slice(1));if(!id){renderPicker();return}const p=plans.find(x=>x.id===id);if(!p){location.hash='';return}renderPlan(p)}
window.addEventListener('hashchange',render);render();
})();
</script>
</body>
</html>
