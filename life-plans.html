<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Help Me Make a Plan | Flourish Anyway</title>
<style>
*{box-sizing:border-box}:root{--p:#d23b67;--y:#f6d86f;--c:#fff8d8;--g:#4e8f3a;--i:#111}
body{margin:0;font-family:Arial,sans-serif;background:var(--c);color:#111;line-height:1.5}.wrap{width:min(900px,calc(100% - 28px));margin:auto}
header{background:var(--y);border-bottom:4px solid #111;padding:24px 0}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand,.home{border:3px solid #111;border-radius:999px;padding:7px 12px;text-decoration:none;font-weight:900;color:#111;background:#fff}.brand{background:var(--p);color:#fff;box-shadow:4px 4px #111}
h1{font-size:clamp(2.2rem,8vw,4.4rem);line-height:.95;margin:25px 0 10px}main{padding:24px 0 50px}
.guide,.panel{background:#fff;border:3px solid #111;border-radius:20px;padding:18px;margin:16px 0;box-shadow:4px 4px rgba(0,0,0,.1)}
.guide h2{margin:3px 0 8px}.eyebrow{font-size:.78rem;font-weight:900;letter-spacing:.08em;color:var(--p)}
.checks{display:grid;gap:8px;margin-top:12px}.check{display:flex;gap:10px;align-items:flex-start;border:2px solid #111;border-radius:11px;padding:10px;background:#fffdf3}.check input{width:22px;height:22px;flex:0 0 auto}.check.done{opacity:.62;text-decoration:line-through}
.actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}.actions a,.toolbtn{display:inline-block;background:#111;color:#fff;text-decoration:none;font-weight:900;border:2px solid #111;border-radius:10px;padding:9px 11px;font-size:.95rem;cursor:pointer}.toolbtn.alt{background:#fff;color:#111}.toolbtn.pink{background:var(--p)}
.plan-tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.learn{background:#fff8d8;border:2px solid #111;border-radius:14px;padding:14px;margin-top:16px}.learn h3{margin:0 0 6px}.notice{font-size:.86rem;color:#544d47;margin-top:25px}.chooser{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.choice{display:block;background:#fff;border:3px solid #111;border-radius:16px;padding:14px;text-decoration:none;color:#111;font-weight:900;box-shadow:3px 3px #111}.choice:hover{transform:translate(-1px,-1px)}
.status{padding:20px;background:#fff;border:3px solid #111;border-radius:16px}.small{font-size:.9rem}.contact{font-weight:900;color:#111}
@media print{header,.plan-tools,.backrow,.notice{display:none!important}body{background:#fff}.guide,.learn{box-shadow:none;border:1px solid #777}.wrap{width:100%}}
</style>
</head>
<body>
<header><div class="wrap"><div class="top"><a class="brand" href="index.html">✿ FLOURISH ANYWAY</a><a class="home" href="index.html">← Home</a></div><h1>HELP ME MAKE A PLAN</h1><p id="subhead">Choose one need and get a focused, step-by-step plan.</p></div></header>
<main><div class="wrap" id="app"><div class="status">Loading Help Plans…</div></div></main>
<script>
const SOURCE='life-plans-all.html?v=20260831g';
const learnMap={
  'first-license':{title:'Learn about this',text:'A first Oregon license is different from reinstating a suspended license. The exact steps can depend on age, testing and required identity/residency documents. Confirm current requirements with Oregon DMV.'},
  'license-back':{title:'Learn about this',text:'A suspension, revocation, court hold and reinstatement requirement are not the same thing. Start by getting the complete status from DMV before paying or completing random items.'},
  'car-legal':{title:'Learn about this',text:'Your driver status and your vehicle status are separate. A valid license does not automatically mean a vehicle is properly titled, registered or insured.'},
  'school':{title:'Learn about this',text:'An IEP and a 504 plan are different school-support pathways. If learning, disability or access concerns may be involved, ask the school what evaluation process applies.'},
  'rent-utilities':{title:'Learn about this',text:'Applying for assistance does not automatically stop an eviction, court deadline or utility shutoff. Confirm deadlines directly with the landlord, utility, court or qualified legal-help provider.'},
  'ohp':{title:'Learn about this',text:'OHP is Oregon Medicaid. After approval, your coordinated care organization or plan can affect which providers you use, so check the plan before choosing care.'},
  'treatment':{title:'Learn about this',text:'Detox/withdrawal management, outpatient, intensive outpatient and residential treatment are different levels of care. An assessment can help determine the safest fit.'},
  'withdrawal':{title:'Learn about this',text:'Withdrawal from some substances can be medically dangerous. A treatment or medical provider should determine whether withdrawal management or emergency care is appropriate.'},
  'divorce':{title:'Learn about this',text:'Oregon divorce forms differ depending on whether you are filing or responding and whether children are involved. Court self-help can explain procedure; legal advice should come from a qualified legal professional.'},
  'child-support':{title:'Learn about this',text:'Child-support issues can involve a new order, enforcement, arrears or modification. The correct next step depends on which issue applies to your case.'}
};
function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function bindChecks(root){root.querySelectorAll('[data-check]').forEach(x=>{const k='flourish-plan-'+x.dataset.check;x.checked=localStorage.getItem(k)==='1';x.closest('.check')?.classList.toggle('done',x.checked);x.addEventListener('change',()=>{localStorage.setItem(k,x.checked?'1':'0');x.closest('.check')?.classList.toggle('done',x.checked)})})}
function planText(section){const clone=section.cloneNode(true);clone.querySelectorAll('input').forEach(i=>{const label=i.closest('label'); if(label){const mark=i.checked?'☑':'☐'; label.insertAdjacentText('afterbegin',mark+' ')} i.remove()});return clone.innerText.trim()}
function addTools(section,id){const tools=document.createElement('div');tools.className='plan-tools';tools.innerHTML=`<button class="toolbtn pink" id="printBtn">Print / Save PDF</button><button class="toolbtn" id="shareBtn">Share</button><button class="toolbtn" id="emailBtn">Email</button><button class="toolbtn alt" id="clearBtn">Clear checks</button>`;section.after(tools);
 document.getElementById('printBtn').onclick=()=>window.print();
 document.getElementById('clearBtn').onclick=()=>{section.querySelectorAll('[data-check]').forEach(x=>{x.checked=false;localStorage.removeItem('flourish-plan-'+x.dataset.check);x.closest('.check')?.classList.remove('done')})};
 document.getElementById('shareBtn').onclick=async()=>{const data={title:section.querySelector('h2')?.textContent||'Flourish Help Plan',text:planText(section),url:location.href}; if(navigator.share){try{await navigator.share(data)}catch(e){}} else {await navigator.clipboard.writeText(data.text+'\n\n'+data.url);alert('Plan copied to clipboard.')}};
 document.getElementById('emailBtn').onclick=()=>{const subject=encodeURIComponent('My Flourish Help Plan: '+(section.querySelector('h2')?.textContent||''));const body=encodeURIComponent(planText(section)+'\n\n'+location.href);location.href='mailto:?subject='+subject+'&body='+body};
}
function addLearn(section,id){const info=learnMap[id];if(!info)return;const d=document.createElement('div');d.className='learn';d.innerHTML=`<h3>${esc(info.title)}</h3><p>${esc(info.text)}</p>`;section.appendChild(d)}
function disclaimer(){return `<p class="notice"><strong>Community information only.</strong> Flourish Anyway provides navigation and community-resource information, not legal, medical, financial or emergency advice. Listings are not endorsements. Eligibility, costs, availability, schedules, forms and program rules can change; confirm important details directly with the provider or official agency. For immediate danger call 911; for suicide or mental-health crisis support call or text 988. <br><br><strong>Missing or outdated resource?</strong> No directory can include every local organization. If you know of a resource we missed or a listing needs correction, please <a class="contact" href="https://weflourishanyway.org/" target="_blank" rel="noopener">contact Flourish Anyway</a> so it can be reviewed.</p>`}
async function load(){const app=document.getElementById('app');try{const r=await fetch(SOURCE,{cache:'no-store'});if(!r.ok)throw new Error('source');const html=await r.text();const doc=new DOMParser().parseFromString(html,'text/html');const plans=[...doc.querySelectorAll('.guide')];if(!plans.length)throw new Error('plans');const id=decodeURIComponent(location.hash.replace('#',''));
 if(id){const original=plans.find(p=>p.id===id);if(!original){location.hash='';return load()}document.getElementById('subhead').textContent='One need. One focused plan. Check things off as you go.';app.innerHTML='<div class="backrow"><a class="home" href="life-plans.html">← Back to Help Plans</a></div>';const section=original.cloneNode(true);app.appendChild(section);bindChecks(section);addLearn(section,id);addTools(section,id);app.insertAdjacentHTML('beforeend',disclaimer());document.title=(section.querySelector('h2')?.textContent||'Help Plan')+' | Flourish Anyway';window.scrollTo(0,0);
 }else{document.getElementById('subhead').textContent='Choose the situation that fits best. You will only see that plan.';app.innerHTML='<div class="panel"><div class="eyebrow">HELP PLANS</div><h2>What do you need help with?</h2><p>Pick one. You can come back here anytime.</p><div class="chooser"></div></div>';const chooser=app.querySelector('.chooser');plans.forEach(p=>{const a=document.createElement('a');a.className='choice';a.href='#'+encodeURIComponent(p.id);a.textContent=p.querySelector('h2')?.textContent||p.id;chooser.appendChild(a)});app.insertAdjacentHTML('beforeend',disclaimer());}
 }catch(e){app.innerHTML='<div class="status"><strong>Help Plans could not load.</strong><br>Please go back to the home page and try again in a moment.</div>'+disclaimer()}}
window.addEventListener('hashchange',load);load();
</script>
</body>
</html>
