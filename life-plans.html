<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Help Me Make a Plan | Flourish Anyway</title>
<style>
*{box-sizing:border-box}:root{--p:#ce3c5f;--y:#fad569;--c:#FDF8F5;--pl:#fce8ed;--g:#4e8f3a;--d:#2C1A22;--w:#fff}
body{margin:0;font-family:Arial,sans-serif;background:var(--c);color:var(--d);line-height:1.5}.wrap{width:min(920px,calc(100% - 28px));margin:auto}
header{background:var(--y);border-bottom:4px solid var(--d);padding:22px 0}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.brand,.home{border:3px solid var(--d);border-radius:999px;padding:7px 12px;text-decoration:none;font-weight:900;color:var(--d);background:#fff}.brand{background:var(--p);color:#fff;box-shadow:4px 4px var(--d)}
h1{font-size:clamp(2.1rem,8vw,4.2rem);line-height:.96;margin:24px 0 8px}main{padding:24px 0 52px}
.panel,.guide{background:#fff;border:3px solid var(--d);border-radius:20px;padding:18px;margin:16px 0;box-shadow:4px 4px rgba(44,26,34,.10)}
.eyebrow{font-size:.76rem;font-weight:900;letter-spacing:.08em;color:var(--p);text-transform:uppercase}.small{font-size:.9rem;color:#65565c}
.search{width:100%;min-height:48px;border:2px solid var(--d);border-radius:12px;padding:10px 12px;font:inherit;background:#fff;margin:10px 0 14px}
.group{margin:20px 0}.group h3{margin:0 0 9px;background:var(--y);border:2px solid var(--d);border-radius:12px;padding:9px 11px}.chooser{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:10px}
.choice{display:block;background:#fff;border:2px solid var(--d);border-radius:14px;padding:13px;text-decoration:none;color:var(--d);font-weight:900;min-height:62px}.choice:hover{background:var(--pl)}
.backrow{margin-bottom:10px}.progressrow{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:10px 0 8px;font-weight:900}.bar{height:12px;background:#eee;border:2px solid var(--d);border-radius:999px;overflow:hidden}.bar>div{height:100%;background:var(--p);width:0}
.stepcard{background:#fff;border:3px solid var(--d);border-radius:20px;padding:20px;margin:16px 0;box-shadow:5px 5px rgba(44,26,34,.10)}.stepnum{font-size:.8rem;font-weight:900;color:var(--p);letter-spacing:.06em}.stepcard h2{margin:5px 0 8px;font-size:1.5rem}.steptext{margin:0 0 16px}
.checkline{display:flex;gap:12px;align-items:flex-start;background:var(--pl);border:2px solid var(--d);border-radius:14px;padding:13px;font-weight:900}.checkline input{width:25px;height:25px;flex:0 0 auto;accent-color:var(--p)}.checkline.done{opacity:.68;text-decoration:line-through}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:15px}.btn{border:2px solid var(--d);border-radius:11px;padding:10px 13px;background:#fff;color:var(--d);font-weight:900;text-decoration:none;cursor:pointer;font:inherit}.btn.primary{background:var(--d);color:#fff}.btn.pink{background:var(--p);color:#fff}.btn:disabled{opacity:.4;cursor:default}
.summary{background:#fff;border:3px solid var(--d);border-radius:18px;padding:16px;margin-top:18px}.summary h3{margin:0 0 10px}.summary .item{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid #ddd}.summary .item:last-child{border-bottom:0}.summary .mark{font-weight:900;min-width:22px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.actions a{display:inline-block;background:var(--d);color:#fff;text-decoration:none;border:2px solid var(--d);border-radius:10px;padding:9px 11px;font-weight:900}.actions a.call{background:var(--g)}
.quick{display:grid;gap:8px;margin-top:14px}.quickcard{background:var(--y);border:2px solid var(--d);border-radius:12px;padding:11px}.quickcard a{font-weight:900;color:var(--d)}
.script{background:#fff8d8;border-left:6px solid var(--p);padding:12px;border-radius:10px;margin-top:14px}.notice{font-size:.84rem;color:#65565c;margin-top:24px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.complete{background:var(--y);border:3px solid var(--d);border-radius:18px;padding:18px;margin-top:18px}.complete h2{margin:0 0 8px}
@media(max-width:680px){.chooser{grid-template-columns:1fr}.navrow .btn{flex:1;text-align:center}.progressrow{align-items:flex-start;flex-direction:column}}
@media print{header,.backrow,.navrow,.tools,.notice,.search{display:none!important}body{background:#fff}.panel,.stepcard,.summary,.complete{box-shadow:none;border:1px solid #777}.wrap{width:100%}.stepcard{display:block!important;break-inside:avoid}}

.stepblock{margin:22px 0 0;padding-top:18px;border-top:2px solid #eee5df}.stepblock h3{margin:0 0 12px;font-size:1.12rem}.worksheet{background:#fffaf0;border:2px solid #ead9a2;border-radius:18px;padding:16px}.worksheet div{padding:9px 0;border-bottom:1px solid #eadfc5;line-height:1.45}.worksheet div:last-child{border-bottom:0}.worksheet .fieldrow{padding:10px 0}.worksheet .fieldprompt{font-weight:800;margin-bottom:7px}.worksheet input[type="text"],.worksheet textarea{width:100%;box-sizing:border-box;border:2px solid #bcae91;border-radius:10px;background:#fff;padding:10px 11px;font:inherit;color:var(--d);resize:vertical}.worksheet textarea{min-height:72px}.worksheet .savedanswer{font-size:.78rem;font-weight:800;color:#6f5d64;margin-top:5px}@media print{.worksheet input[type="text"],.worksheet textarea{border:1px solid #777;background:#fff;color:#000;overflow:visible}.worksheet .savedanswer{display:none}}.stepnote{margin:18px 0 0;padding:14px 16px;background:#fff6cf;border-left:6px solid #d83d67;border-radius:12px;line-height:1.5}.stepcard .quick{display:grid;gap:10px}.stepcard .quickcard{background:#ffd96f;border:2px solid #332028;border-radius:16px;padding:14px 16px}.stepcard .quickcard a{color:#332028;font-weight:800}.stepcard .script{margin:0;background:#fff8d9;border-left:7px solid #d83d67;border-radius:14px;padding:16px;line-height:1.55}
</style>
</head>
<body>
<header><div class="wrap"><div class="top"><a class="brand" href="https://weflourishanyway.org/" target="_blank" rel="noopener">✿ FLOURISH ANYWAY ↗</a><a class="home" href="index.html">← Resource Hub</a></div><h1>HELP ME MAKE A PLAN</h1><p id="subhead">Choose one situation. We will walk through it one step at a time.</p></div></header>
<main><div class="wrap" id="app"><div class="panel">Loading Help Plans…</div></div></main>
<script src="life-plans-data.js?v=20260905-fillable1"></script>
<script>
(function(){
 const app=document.getElementById('app');
 const plans=window.FLOURISH_LIFE_PLANS||[];
 const cats=window.FLOURISH_HELP_PLAN_CATEGORIES||{};
 const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
 const key=id=>'flourish-plan-'+id;
 const isDone=id=>localStorage.getItem(key(id))==='1';
 const setDone=(id,v)=>localStorage.setItem(key(id),v?'1':'0');
 function disclaimer(){return `<p class="notice"><strong>Community information only.</strong> Flourish Anyway provides navigation and community-resource information, not legal, medical, financial or emergency advice. Program details can change; confirm important information with the provider or official agency. For immediate danger call 911; for suicide or mental-health crisis support call or text 988.</p>`}
 function picker(){
   document.getElementById('subhead').textContent='Choose the situation that fits best. You will only work on one plan at a time.';
   const grouped={}; plans.forEach(p=>{const c=p.category||'other';(grouped[c]||(grouped[c]=[])).push(p)});
   app.innerHTML=`<section class="panel"><div class="eyebrow">HELP PLANS</div><h2>What do you need help with?</h2><p>Pick one situation. You can stop anytime and come back later—your checked steps stay saved on this device.</p><input id="planSearch" class="search" type="search" autocomplete="off" placeholder="Search plans, like rent, school, license, recovery..."><div id="groups"></div></section>${disclaimer()}`;
   const holder=document.getElementById('groups');
   function draw(q=''){
     const needle=q.trim().toLowerCase(); holder.innerHTML='';
     Object.entries(grouped).forEach(([cid,list])=>{
       const matches=list.filter(p=>!needle || `${p.title||''} ${p.intro||''} ${cats[cid]||cid}`.toLowerCase().includes(needle)); if(!matches.length)return;
       const sec=document.createElement('section'); sec.className='group'; sec.innerHTML=`<h3>${esc(cats[cid]||cid)}</h3><div class="chooser"></div>`;
       const ch=sec.querySelector('.chooser'); matches.forEach(p=>{const a=document.createElement('a');a.className='choice';a.href='#'+encodeURIComponent(p.id);const done=(p.checks||[]).filter(x=>isDone(x.id)).length,total=(p.checks||[]).length;a.innerHTML=`${esc(p.title||p.id)}${done?`<div class="small">${done} of ${total} steps checked</div>`:''}`;ch.appendChild(a)});holder.appendChild(sec);
     });
     if(!holder.children.length)holder.innerHTML='<div class="panel"><strong>No matching Help Plan.</strong><br>Try a shorter word.</div>';
   }
   document.getElementById('planSearch').addEventListener('input',e=>draw(e.target.value)); draw();
 }
 function planView(plan){
   document.getElementById('subhead').textContent='Work through the steps in order. Everything stays on one page so you can see the whole plan.';
   const checks=plan.checks||plan.steps||[];
   const answerKey=(stepId,i)=>'flourish-answer-'+plan.id+'-'+stepId+'-'+i;
   const getAnswer=(stepId,i)=>localStorage.getItem(answerKey(stepId,i))||'';
   const setAnswer=(stepId,i,v)=>localStorage.setItem(answerKey(stepId,i),v);

   function contactsHtml(c){
     if(!(c.contacts||[]).length)return '';
     return `<div class="stepblock"><h3>Who to contact</h3><div class="quick">${
       c.contacts.map(q=>`<div class="quickcard"><strong>${esc(q.label||'Contact')}</strong><br>${
         q.href?`<a href="${esc(q.href)}"${/^https?:/.test(q.href||'')?' target="_blank" rel="noopener"':''}>${esc(q.value||q.href)}</a>`:esc(q.value||'')
       }</div>`).join('')
     }</div></div>`;
   }

   function worksheetHtml(c){
     if(!(c.worksheet||[]).length)return '';
     return `<div class="stepblock"><h3>Write it down</h3><div class="worksheet">${
       c.worksheet.map((x,i)=>`<div class="fieldrow"><div class="fieldprompt">${esc(x)}</div><textarea data-answer-step="${esc(c.id)}" data-answer-index="${i}" aria-label="${esc(x)}">${esc(getAnswer(c.id,i))}</textarea><div class="savedanswer">Saved automatically on this device</div></div>`).join('')
     }</div></div>`;
   }

   function stepHtml(c,idx){
     const checked=isDone(c.id);
     const say=c.script?`<div class="stepblock"><h3>Ask exactly</h3><div class="script">${esc(c.script)}</div></div>`:'';
     const note=c.note?`<div class="stepnote"><strong>Good to know:</strong> ${esc(c.note)}</div>`:'';
     return `<section class="stepcard" id="${esc(c.id)}">
       <div class="stepnum">STEP ${idx+1}</div>
       <h2>${esc(c.title||c.text||'Next step')}</h2>
       ${c.title&&c.text?`<p class="steptext">${esc(c.text)}</p>`:''}
       ${contactsHtml(c)}
       ${say}
       ${worksheetHtml(c)}
       ${note}
       <label class="checkline ${checked?'done':''}">
         <input type="checkbox" data-step-check="${esc(c.id)}" ${checked?'checked':''}>
         <span>${checked?'Done — keep this checked':'Check this box when this step is done'}</span>
       </label>
     </section>`;
   }

   const done=checks.filter(c=>isDone(c.id)).length,total=checks.length;
   const quick=(plan.quick||[]).length?`<section class="summary"><h3>Quick contacts</h3><div class="quick">${
     plan.quick.map(q=>`<div class="quickcard"><strong>${esc(q.label||'Contact')}</strong><br>${q.href?`<a href="${esc(q.href)}"${/^https?:/.test(q.href||'')?' target="_blank" rel="noopener"':''}>${esc(q.value||q.href)}</a>`:esc(q.value||'')}</div>`).join('')
   }</div></section>`:'';
   const actions=(plan.actions||[]).length?`<section class="summary"><h3>Official resources</h3><div class="actions">${
     plan.actions.map(a=>`<a ${String(a.href||'').startsWith('tel:')?'class="call"':''} href="${esc(a.href||'#')}"${/^https?:/.test(a.href||'')?' target="_blank" rel="noopener"':''}>${esc(a.label||'Open resource')}</a>`).join('')
   }</div></section>`:'';
   const topScript=plan.script?`<section class="summary"><h3>What to say</h3><div class="script">${esc(plan.script)}</div></section>`:'';

   app.innerHTML=`<div class="backrow"><a class="home" href="life-plans.html">← All Help Plans</a></div>
   <section class="panel">
     <div class="eyebrow">${esc(plan.eyebrow||'HELP PLAN')}</div>
     <h2>${esc(plan.title||'Help Plan')}</h2>
     <p>${esc(plan.intro||'')}</p>
     <div class="progressrow"><span>${total} steps</span><span id="doneLabel">${done} checked</span></div>
     <div class="bar"><div id="barFill" style="width:${total?Math.round(done/total*100):0}%"></div></div>
   </section>
   <div id="allSteps">${checks.map(stepHtml).join('')}</div>
   ${quick}${topScript}${actions}
   <div class="tools">
     <button class="btn pink" id="printBtn">Print / Save PDF</button>
     <button class="btn" id="shareBtn">Share</button>
     <button class="btn" id="emailBtn">Email</button>
     <button class="btn" id="clearBtn">Clear checks</button>
   </div>
   ${disclaimer()}`;

   function refreshProgress(){
     const doneNow=checks.filter(c=>isDone(c.id)).length;
     const dl=document.getElementById('doneLabel');
     const bf=document.getElementById('barFill');
     if(dl)dl.textContent=`${doneNow} checked`;
     if(bf)bf.style.width=(total?Math.round(doneNow/total*100):0)+'%';
   }

   app.querySelectorAll('[data-answer-step]').forEach(el=>{
     el.addEventListener('input',()=>setAnswer(el.dataset.answerStep,el.dataset.answerIndex,el.value));
   });
   app.querySelectorAll('[data-step-check]').forEach(box=>{
     box.addEventListener('change',e=>{
       setDone(e.target.dataset.stepCheck,e.target.checked);
       const label=e.target.closest('.checkline');
       if(label){
         label.classList.toggle('done',e.target.checked);
         const span=label.querySelector('span');
         if(span)span.textContent=e.target.checked?'Done — keep this checked':'Check this box when this step is done';
       }
       refreshProgress();
     });
   });

   function saveVisibleAnswers(){
     app.querySelectorAll('[data-answer-step]').forEach(el=>setAnswer(el.dataset.answerStep,el.dataset.answerIndex,el.value));
   }
   function planText(){
     const lines=[plan.title,''];
     checks.forEach(c=>{
       lines.push(`${isDone(c.id)?'☑':'☐'} ${c.title||c.text||''}${c.title&&c.text?' — '+c.text:''}`);
       (c.worksheet||[]).forEach((prompt,i)=>{
         const answer=getAnswer(c.id,i).trim();
         if(answer)lines.push(`   ${prompt} ${answer}`);
       });
     });
     if(plan.script)lines.push('','What to say:',plan.script);
     return lines.join('\n');
   }

   document.getElementById('printBtn').onclick=()=>{saveVisibleAnswers();window.print()};
   document.getElementById('shareBtn').onclick=async()=>{
     saveVisibleAnswers();
     const data={title:'Flourish Anyway Help Plan: '+plan.title,text:planText(),url:location.href};
     if(navigator.share){try{await navigator.share(data)}catch(e){}}
     else{await navigator.clipboard?.writeText(data.text+'\n\n'+data.url);alert('Plan copied.')}
   };
   document.getElementById('emailBtn').onclick=()=>{
     saveVisibleAnswers();
     location.href='mailto:?subject='+encodeURIComponent('My Flourish Help Plan: '+plan.title)+'&body='+encodeURIComponent(planText()+'\n\n'+location.href)
   };
   document.getElementById('clearBtn').onclick=()=>{
     if(confirm('Clear all checked steps in this plan? Your written answers will stay saved.')){
       checks.forEach(c=>localStorage.removeItem(key(c.id)));
       app.querySelectorAll('[data-step-check]').forEach(box=>{
         box.checked=false;
         const label=box.closest('.checkline');
         if(label){
           label.classList.remove('done');
           const span=label.querySelector('span');
           if(span)span.textContent='Check this box when this step is done';
         }
       });
       refreshProgress();
     }
   };
 } function route(){const id=decodeURIComponent(location.hash.slice(1));if(!id)return picker();const p=plans.find(x=>x.id===id);if(!p){location.hash='';return}planView(p);window.scrollTo(0,0)}
 window.addEventListener('hashchange',route); route();
})();
</script>
</body></html>
