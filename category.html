<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resources | Flourish Anyway</title><style>

*{box-sizing:border-box}:root{--p:#d23b67;--y:#fad569;--c:#fff8d8;--g:#4e8f3a;--i:#111;--w:#fffdf3;--pl:#fce8ed}
body{margin:0;font-family:Arial,sans-serif;color:var(--i);background:var(--c);line-height:1.45}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}
header{padding:24px 0;background:var(--y);border-bottom:4px solid #111}.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:inline-block;background:var(--p);color:#fff;border:3px solid #111;border-radius:999px;padding:7px 13px;font-weight:900;box-shadow:4px 4px #111;text-decoration:none}
.home{font-weight:900;color:#111;text-decoration:none;border:2px solid #111;border-radius:999px;padding:7px 11px;background:#fff}
h1{font-size:clamp(2rem,7vw,4.2rem);line-height:1;margin:24px 0 12px}.lead{font-size:1.05rem;max-width:780px}main{padding:26px 0 48px}
.eyebrow{font-size:.8rem;font-weight:900;letter-spacing:.08em;color:var(--p)}

.panel,.helpbox{background:var(--w);border:3px solid #111;border-radius:20px;padding:18px;box-shadow:5px 5px rgba(0,0,0,.10);margin-bottom:20px}
.searchgrid{display:grid;grid-template-columns:2fr 1fr auto;gap:10px;align-items:end}.field{display:grid;gap:5px;font-weight:900}select,button{font:inherit;min-height:48px;border:2px solid #111;border-radius:12px;padding:9px;background:#fff}.go{background:#111;color:#fff;font-weight:900}
.helpchoices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}.helpchoice{display:block;text-decoration:none;color:#111;border:2px solid #111;border-radius:13px;padding:12px;background:#fff;font-weight:900}
.count{font-weight:900;margin:15px 0 8px}.results{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.result{background:#fff;border:3px solid #111;border-radius:18px;padding:17px;box-shadow:4px 4px rgba(0,0,0,.1)}.result h3{margin:3px 0 8px}.category{font-size:.75rem;font-weight:900;color:var(--p);text-transform:uppercase}.meta{display:grid;gap:5px;font-size:.9rem}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.actions a{text-decoration:none;border:2px solid #111;border-radius:9px;padding:7px 9px;background:#111;color:#fff;font-size:.82rem;font-weight:900}.actions a.alt{background:#fff;color:#111}.actions a.call{background:var(--g)}
.section-block{margin:18px 0 25px}.section-title{margin:0 0 12px;border:3px solid #111;border-radius:18px;padding:15px 18px;font-size:1.35rem;box-shadow:4px 4px rgba(0,0,0,.1)}.section-block:nth-child(odd) .section-title{background:var(--y)}.section-block:nth-child(even) .section-title{background:var(--pl)}
.empty{background:#fff;border:2px dashed #111;border-radius:14px;padding:18px}.gateway{background:var(--y);border:3px solid #111;border-radius:18px;padding:17px;margin-top:22px}
@media(max-width:760px){.searchgrid,.helpchoices,.results{grid-template-columns:1fr}.go{width:100%}}
</style></head><body>
<header><div class="wrap"><div class="topbar"><a class="brand" href="index.html">✿ FLOURISH ANYWAY</a><a class="home" href="index.html">← Home</a></div><h1 id="title">RESOURCES</h1><p id="lead" class="lead">Local resources for Jackson and Josephine Counties.</p></div></header>
<main><div class="wrap"><div id="help"></div>
<section class="panel"><div class="searchgrid"><label class="field">Directory<select id="cat"></select></label><label class="field">County<select id="county"><option value="all">Both counties</option><option value="Jackson">Jackson County</option><option value="Josephine">Josephine County</option></select></label><button class="go" id="searchPage">Search this need →</button></div></section>
<div id="count" class="count">Loading resources…</div><div id="results"></div>
<section class="gateway"><h3>Need something else?</h3><div class="actions"><a href="search.html">Ask in your own words →</a><a href="life-plans.html" class="alt">Help Me Make a Plan →</a></div></section>
</div></main>
<script src="hub-pathways-data.js"></script><script src="resource-loader.js"></script><script src="life-plans-data.js?v=20260904master1"></script><script>
const H=window.FLOURISH_HUB_PATHWAYS||{categories:{},categoryPlans:{}},plans=window.FLOURISH_LIFE_PLANS||[],planById=Object.fromEntries(plans.map(p=>[p.id,p]));
const params=new URLSearchParams(location.search),cat=document.getElementById("cat"),county=document.getElementById("county");county.value=params.get("county")||"all";
function renderHelp(id){const usable=(H.categoryPlans[id]||[]).map(x=>planById[x]).filter(Boolean);if(!usable.length)return "";return `<section class="helpbox"><div class="eyebrow">START WITH YOUR SITUATION</div><h2>What are you trying to solve?</h2><p>Choose one for step-by-step help, or keep scrolling for every resource.</p><div class="helpchoices">${usable.map(p=>`<a class="helpchoice" href="life-plans.html#${encodeURIComponent(p.id)}">${esc(p.title)} →</a>`).join("")}</div></section>`;}
function render(){const id=cat.value,co=county.value,cfg=H.categories[id]||{name:id,desc:""};document.getElementById("title").textContent=(cfg.name||"Resources").toUpperCase();document.getElementById("lead").textContent=cfg.desc||"Local resources.";document.title=(cfg.name||"Resources")+" | Flourish Anyway";document.getElementById("help").innerHTML=renderHelp(id);
const rows=RES.filter(r=>r.category===id&&(co==="all"||(r.counties||[]).includes(co)));document.getElementById("count").textContent=`${rows.length} resource${rows.length===1?"":"s"}`;
if(!rows.length){document.getElementById("results").innerHTML=`<div class="empty"><b>No resources are loaded for this directory yet.</b><p>Use Search or Help Me Make a Plan while this chapter is being completed.</p></div>`;return;}
const sections=new Map();rows.forEach(r=>{const s=r.section||"Resources";if(!sections.has(s))sections.set(s,[]);sections.get(s).push(r);});document.getElementById("results").innerHTML=[...sections.entries()].map(([s,items])=>`<section class="section-block"><h2 class="section-title">${esc(s)}</h2><div class="results">${items.map(resultCard).join("")}</div></section>`).join("");}
getResources().then(()=>{const counts={};RES.forEach(r=>counts[r.category]=(counts[r.category]||0)+1);const ids=Object.keys(H.categories).filter(id=>counts[id]>0);cat.innerHTML=ids.map(id=>`<option value="${esc(id)}">${esc((H.categories[id]||{}).name||id)}</option>`).join("");let requested=params.get("cat")||"food";if(!ids.includes(requested))requested=ids[0]||"food";cat.value=requested;render();});
cat.addEventListener("change",()=>{history.replaceState(null,"",`?cat=${encodeURIComponent(cat.value)}&county=${encodeURIComponent(county.value)}`);render();});county.addEventListener("change",render);document.getElementById("searchPage").onclick=()=>{location.href=`search.html?q=${encodeURIComponent((H.categories[cat.value]||{}).name||cat.value)}&county=${encodeURIComponent(county.value)}`;}
</script></body></html>
