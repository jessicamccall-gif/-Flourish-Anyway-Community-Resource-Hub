<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resources | Flourish Anyway</title><style>
*{box-sizing:border-box}:root{--p:#d23b67;--y:#f6d86f;--c:#fff8d8;--g:#4e8f3a;--i:#111;--w:#fffdf3}body{margin:0;font-family:Arial,sans-serif;color:var(--i);background:var(--c);line-height:1.45}.wrap{width:min(1050px,calc(100% - 28px));margin:auto}header{padding:24px 0;background:var(--y);border-bottom:4px solid #111}.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{background:var(--p);color:#fff;border:3px solid #111;border-radius:999px;padding:7px 13px;font-weight:900;box-shadow:4px 4px #111;text-decoration:none}.home{font-weight:900;color:#111;text-decoration:none;border:2px solid #111;border-radius:999px;padding:7px 11px;background:#fff}h1{font-size:clamp(2rem,7vw,4.2rem);line-height:1;margin:24px 0 12px}main{padding:26px 0 48px}.helpbox,.result,.gateway{background:#fff;border:3px solid #111;border-radius:18px;padding:17px;box-shadow:4px 4px rgba(0,0,0,.1)}.helpbox{margin-bottom:22px}.eyebrow,.category{font-size:.76rem;font-weight:900;color:var(--p);text-transform:uppercase}.helpchoices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.helpchoice{display:block;text-decoration:none;color:#111;border:2px solid #111;border-radius:14px;padding:14px;background:var(--c);font-weight:900}.count{font-weight:900;margin:8px 0 18px}.section-block{margin:26px 0}.section-title{border-bottom:4px solid #111;padding-bottom:7px}.results{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.result h3{margin:3px 0 8px}.meta{display:grid;gap:5px;font-size:.9rem}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.actions a,.actions button{text-decoration:none;border:2px solid #111;border-radius:9px;padding:7px 9px;background:#111;color:#fff;font-size:.82rem;font-weight:900;cursor:pointer}.actions a.alt{background:#fff;color:#111}.actions a.call{background:var(--g)}.gateway{background:var(--y);margin-top:28px}@media(max-width:760px){.results,.helpchoices{grid-template-columns:1fr}}
</style></head><body><header><div class="wrap"><div class="topbar"><a class="brand" href="index.html">✿ FLOURISH ANYWAY</a><a class="home" href="index.html">← Home</a></div><h1 id="title">RESOURCES</h1><p>Start with the problem you are trying to solve. Full local resources are organized underneath.</p></div></header><main><div class="wrap"><div id="help"></div><div id="count" class="count">Loading resources…</div><div id="results"></div><section class="gateway"><h3>Need something else?</h3><div class="actions"><a href="search.html">Ask a question →</a><a href="saved.html">My Saved Resources →</a><a href="https://www.211info.org/" target="_blank" rel="noopener">Search 211info ↗</a></div></section></div></main><script src="resource-loader.js"></script><script>
const p=new URLSearchParams(location.search),c=p.get("cat")||"food";const slug=s=>String(s||"resources").toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function helpFor(x){if(x!=="transportation")return "";return `<section class="helpbox"><div class="eyebrow">START HERE</div><h2>What transportation problem are you trying to solve?</h2><p>You do not need to know the program name. Pick the situation closest to yours.</p><div class="helpchoices"><a class="helpchoice" href="drivers-license.html">🚘 Suspended license / get my license back →</a><a class="helpchoice" href="life-plans.html#first-license">🪪 Getting a first license →</a><a class="helpchoice" href="#kids-and-school-transportation">🚌 School / child transportation →</a><a class="helpchoice" href="#medical-disability-senior-and-veteran-rides">❤️ Medical / OHP / disability / senior / veteran →</a><a class="helpchoice" href="#everyday-buses-and-public-transit">🚏 Everyday bus / Grants Pass ↔ Medford →</a><a class="helpchoice" href="#college-work-and-training">🛠️ College / work / training →</a><a class="helpchoice" href="#long-distance-airport-and-no-car-travel">✈️ Portland / airport / out-of-town →</a><a class="helpchoice" href="#emergency-one-time-transportation-and-more-options">🆘 Emergency / one-time ride or gas help →</a></div></section>`}
function render(){document.getElementById("title").textContent=(CAT[c]||"Resources").toUpperCase();document.title=(CAT[c]||"Resources")+" | Flourish Anyway";document.getElementById("help").innerHTML=helpFor(c);let a=RES.filter(r=>r.category===c).sort((x,y)=>(x.section||"More resources").localeCompare(y.section||"More resources")||x.name.localeCompare(y.name));document.getElementById("count").textContent=`${a.length} resource${a.length===1?"":"s"} • Jackson + Josephine Counties`;let g=new Map();for(const r of a){let s=r.section||"More resources";if(!g.has(s))g.set(s,[]);g.get(s).push(r)}document.getElementById("results").innerHTML=[...g].map(([s,rows])=>`<section class="section-block" id="${slug(s)}"><h2 class="section-title">${esc(s)}</h2><div class="results">${rows.map(resultCard).join("")}</div></section>`).join("")}
getResources().then(()=>{render();if(location.hash)setTimeout(()=>document.querySelector(location.hash)?.scrollIntoView({block:"start"}),100)});
</script></body></html>
